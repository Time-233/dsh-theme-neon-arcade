name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm run check
      - run: npm test
      - run: npm run release:pack
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Publish prebuilt release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Release already exists; keeping its published assets."
          else
            gh release create "$RELEASE_TAG" dist/*.tgz dist/SHA256SUMS.txt --verify-tag --title "NEON ARCADE $RELEASE_TAG" --notes-file docs/RELEASE-NOTES.md --latest
          fi
